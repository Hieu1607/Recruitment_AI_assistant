services:
  postgres:
    image: postgres:15
    container_name: recruitment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recruitment_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruitment_ai"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: recruitment-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    image: python:3.11-slim
    container_name: recruitment-api
    restart: unless-stopped
    working_dir: /app/backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/recruitment_ai
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      BACKEND_PORT: "8000"
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt
      && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    image: python:3.11-slim
    container_name: recruitment-worker
    restart: unless-stopped
    working_dir: /app/backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/recruitment_ai
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt
      && python -m worker.main"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    image: node:20
    container_name: recruitment-frontend
    restart: unless-stopped
    working_dir: /app/frontend
    env_file:
      - ./frontend/.env
    environment:
      FRONTEND_PORT: "5173"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app/frontend
    command: >
      sh -c "npm install
      && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
